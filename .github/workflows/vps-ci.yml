name: vps-ci
on:
  push:
    paths: ['vps/**', '.github/workflows/vps-ci.yml']
  pull_request:
    paths: ['vps/**', '.github/workflows/vps-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats wireguard-tools
      - name: shellcheck
        run: shellcheck -x vps/setup.sh vps/lib/*.sh
      - name: bats
        run: bats vps/tests
