name: windows-ci
on:
  push:
    paths: ['windows/**', '.github/workflows/windows-ci.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-ci.yml']
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build windows/WgVpn.sln --configuration Release
      - name: Test
        run: dotnet test windows/WgVpn.sln --configuration Release --no-build
